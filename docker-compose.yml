services:
  web-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scraper-web-ui
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - SCRAPER_BASE_URL=http://google-maps-scraper:8080
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - DB_PATH=/app/data/users.db
    volumes:
      - users_data:/app/data
    depends_on:
      - google-maps-scraper
    networks:
      - scraper-net

  google-maps-scraper:
    image: gosom/google-maps-scraper:v1.18.1
    container_name: gmaps-scraper
    restart: unless-stopped
    command: ["-web", "-data-folder", "/gmapsdata"]
    expose:
      - "8080"
    volumes:
      - gmaps_data:/gmapsdata
      - gmaps_cache:/opt
    networks:
      - scraper-net

volumes:
  users_data:
  gmaps_data:
  gmaps_cache:

networks:
  scraper-net:
    driver: bridge
